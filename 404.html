<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 | 白程BSCC工作室</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        
        /* 背景模糊图片 */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('404.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(8px) brightness(0.7);
            z-index: -1;
        }
        
        /* 背景图片后备方案（如果图片未加载） */
        .bg-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 71, 171, 0.8) 0%, rgba(0, 0, 0, 0.9) 100%);
        }
        
        /* 主容器 */
        .container {
            max-width: 800px;
            width: 90%;
            text-align: center;
            padding: 40px 30px;
            background: rgba(19, 26, 45, 0.85);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(10px);
            z-index: 1;
            position: relative;
            margin: 20px;
        }
        
        /* 404数字样式 */
        .error-code {
            font-size: 12rem;
            font-weight: 900;
            background: linear-gradient(135deg, #38bdf8, #4ade80, #fbbf24);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        /* 错误标题 */
        .error-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #f8fafc;
        }
        
        /* 错误描述 */
        .error-description {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* 倒计时容器 */
        .countdown-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 12px 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        
        .countdown-text {
            font-size: 1.1rem;
            color: #94a3b8;
        }
        
        .countdown-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
            margin: 0 8px;
            min-width: 30px;
            text-align: center;
        }
        
        /* 按钮样式 */
        .button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            gap: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.3);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }
        
        /* 工作室信息 */
        .studio-info {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .studio-name {
            font-size: 1.8rem;
            color: #f8fafc;
            margin-bottom: 10px;
        }
        
        .studio-slogan {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        
        /* 响应式调整 */
        @media (max-width: 768px) {
            .error-code {
                font-size: 8rem;
            }
            
            .error-title {
                font-size: 2rem;
            }
            
            .error-description {
                font-size: 1.1rem;
            }
            
            .container {
                padding: 30px 20px;
                width: 95%;
            }
            
            .button-container {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
        
        @media (max-width: 480px) {
            .error-code {
                font-size: 6rem;
            }
            
            .error-title {
                font-size: 1.8rem;
            }
            
            .container {
                padding: 25px 15px;
            }
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .container {
            animation: fadeIn 0.8s ease-out;
        }
        
        .error-code {
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        
        .error-title {
            animation: fadeIn 0.8s ease-out 0.4s both;
        }
        
        .error-description {
            animation: fadeIn 0.8s ease-out 0.6s both;
        }
        
        .countdown-container {
            animation: fadeIn 0.8s ease-out 0.8s both;
        }
        
        .button-container {
            animation: fadeIn 0.8s ease-out 1s both;
        }
        
        .studio-info {
            animation: fadeIn 0.8s ease-out 1.2s both;
        }
        
        /* 背景动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        
        .bg-image {
            animation: float 20s ease-in-out infinite;
        }
    </style>
</head>
<body>
<!-- 背景模糊图片 -->
<div class="bg-image"></div>
<!-- 主内容容器 -->
<div class="container"><!-- 404错误代码 -->
<div class="error-code">404</div>
<!-- 错误标题 -->
<h1 class="error-title">(´。＿。｀)</h1>
<h1 class="error-title">页面未找到</h1>
<!-- 错误描述 -->
<p class="error-description">哎呀！您访问的页面似乎不存在或已被移动。<br />可能是链接错误、页面已被删除，或者您输入了错误的URL地址。</p>
<!-- 倒计时显示 -->
<div class="countdown-container"><span class="countdown-text">正在自动跳转到首页，剩余</span> <span class="countdown-number" id="countdown">5</span> <span class="countdown-text">秒</span></div>
<!-- 操作按钮 -->
<div class="button-container"><a href="/" class="btn btn-primary"> <i class="fas fa-home"></i> 返回首页 </a> <a class="btn btn-secondary"> <i class="fas fa-arrow-left"></i> 返回上一页 </a></div>
<!-- 工作室信息 -->
<div class="studio-info">
<div class="studio-name">白程BSCC工作室</div>
<p class="studio-slogan">以热爱为笔，以创意为基，打造方块与兽毛交织的专属天地</p>
</div>
</div>
<p>
<script>
        // 自动跳转倒计时
        let countdown = 5;
        const countdownElement = document.getElementById('countdown');
        const countdownInterval = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(countdownInterval);
                // 跳转到首页
                window.location.href = "/";
            }
        }, 1000);
        
        // 阻止倒计时（如果用户点击了其他链接）
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function(e) {
                // 如果是内部链接，清除倒计时
                if (this.getAttribute('href') !== 'javascript:history.back()') {
                    clearInterval(countdownInterval);
                }
            });
        });
        
        // 图片加载失败处理
        document.querySelector('.bg-image').addEventListener('error', function() {
            // 如果图片加载失败，使用纯色背景
            this.style.backgroundImage = 'none';
            this.style.backgroundColor = '#0f172a';
        });
        
        // 添加键盘快捷键支持
        document.addEventListener('keydown', function(e) {
            // 按ESC键直接返回首页
            if (e.key === 'Escape') {
                clearInterval(countdownInterval);
                window.location.href = "/";
            }
            
            // 按B键返回上一页
            if (e.key === 'b' || e.key === 'B') {
                clearInterval(countdownInterval);
                history.back();
            }
        });
        
        // 添加页面加载完成提示
        window.addEventListener('load', function() {
            console.log('白程BSCC工作室 - 404页面已加载');
        });
    </script>
</p>
</body>
</html>
