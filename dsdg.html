<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BScc 工作室论坛</title>
    <style>
        /* ====== 基础样式 ====== */
        :root {
            --primary: #2ea043;
            --primary-hover: #238636;
            --bg: #0d1117;
            --card-bg: #161b22;
            --text: #c9d1d9;
            --text-muted: #8b949e;
            --border: #30363d;
            --success: #3fb950;
            --error: #f85149;
            --warning: #d29922;
            --info: #58a6ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ====== 顶部导航栏 ====== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
            color: var(--primary);
        }

        .logo-icon {
            font-size: 24px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ====== 主内容区 ====== */
        .container {
            max-width: 1200px;
            margin: 80px auto 20px;
            padding: 0 20px;
        }

        /* ====== 登录页面 ====== */
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px 30px;
        }

        .login-title {
            font-size: 28px;
            margin-bottom: 10px;
            color: var(--text);
        }

        .login-subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: #24292e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .login-btn:hover {
            background: #2d3339;
            transform: translateY(-2px);
        }

        .github-icon {
            width: 20px;
            height: 20px;
        }

        /* ====== 论坛主页 ====== */
        .forum-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .post-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(46, 160, 67, 0.1);
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .post-author {
            font-weight: 600;
            color: var(--text);
        }

        .post-date {
            color: var(--text-muted);
            font-size: 12px;
        }

        .post-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text);
        }

        .post-preview {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-stats {
            display: flex;
            gap: 15px;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ====== 发帖页面 ====== */
        .new-post-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-weight: 500;
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(46, 160, 67, 0.1);
        }

        .form-textarea {
            min-height: 200px;
            resize: vertical;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: #1c2128;
        }

        /* ====== 右侧弹窗系统 ====== */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 350px;
        }

        .toast {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: slideInRight 0.3s ease-out;
            position: relative;
            overflow: hidden;
        }

        .toast::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
        }

        .toast-success::before {
            background: var(--success);
        }

        .toast-error::before {
            background: var(--error);
        }

        .toast-warning::before {
            background: var(--warning);
        }

        .toast-info::before {
            background: var(--info);
        }

        .toast-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .toast-message {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .toast-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toast-close:hover {
            color: var(--text);
        }

        /* ====== 开发者入口 ====== */
        .dev-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            color: transparent;
            cursor: pointer;
            z-index: 9999;
            border-radius: 50%;
            opacity: 0.1;
            transition: opacity 0.3s;
        }

        .dev-btn:hover {
            opacity: 0.3;
        }

        .dev-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .dev-modal.active {
            display: flex;
        }

        .dev-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
        }

        .dev-title {
            text-align: center;
            margin-bottom: 20px;
            color: var(--warning);
        }

        .dev-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
        }

        .dev-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        /* ====== 动画 ====== */
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }

        /* ====== 响应式设计 ====== */
        @media (max-width: 768px) {
            .posts-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 0 15px;
            }
            
            .header {
                padding: 0 15px;
            }
            
            .nav-links {
                gap: 10px;
            }
        }

        /* ====== 页面切换动画 ====== */
        .page {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="logo">
            <span class="logo-icon">💬</span>
            BScc 工作室论坛
        </div>
        <div class="nav-links">
            <button class="btn btn-secondary" onclick="showPage('home')">🏠 首页</button>
            <button class="btn btn-secondary" onclick="showPage('new-post')">📝 发帖</button>
            <div id="userInfo" class="user-info" style="display: none;">
                <div class="avatar" id="userAvatar">U</div>
                <span id="userName">用户</span>
                <button class="btn btn-secondary" onclick="logout()" style="padding: 6px 12px; font-size: 12px;">
                    退出
                </button>
            </div>
        </div>
    </header>

    <!-- 开发者入口 -->
    <button class="dev-btn" onclick="showDevModal()">.</button>

    <!-- 开发者登录模态框 -->
    <div id="devModal" class="dev-modal">
        <div class="dev-content">
            <h3 class="dev-title">🔧 开发者入口</h3>
            <input type="text" id="devUsername" class="dev-input" placeholder="账户" onkeypress="devKeyPress(event)">
            <input type="password" id="devPassword" class="dev-input" placeholder="密码" onkeypress="devKeyPress(event)">
            <div class="dev-actions">
                <button class="btn btn-primary" onclick="devLogin()">登录</button>
                <button class="btn btn-secondary" onclick="closeDevModal()">取消</button>
            </div>
        </div>
    </div>

    <!-- 右侧弹窗容器 -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- 登录页面 -->
    <div id="loginPage" class="page active">
        <div class="container">
            <div class="login-container">
                <div class="login-card">
                    <h1 class="login-title">👋 欢迎回来！</h1>
                    <p class="login-subtitle">
                        使用您的 GitHub 账号登录 BScc 工作室论坛<br>
                        与团队成员分享想法、讨论项目
                    </p>
                    <button class="login-btn" onclick="githubLogin()">
                        <svg class="github-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                        </svg>
                        使用 GitHub 账号登录
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 论坛首页 -->
    <div id="homePage" class="page">
        <div class="container">
            <div class="forum-header">
                <h1 style="font-size: 28px;">📚 最新讨论</h1>
                <button class="btn btn-primary" onclick="loadPosts()">🔄 刷新</button>
            </div>
            <div id="postsContainer" class="posts-grid">
                <!-- 帖子会动态加载到这里 -->
            </div>
        </div>
    </div>

    <!-- 发帖页面 -->
    <div id="newPostPage" class="page">
        <div class="container">
            <div class="new-post-container">
                <h1 style="font-size: 28px; margin-bottom: 30px;">📝 创建新帖子</h1>
                <div class="form-group">
                    <label class="form-label">标题</label>
                    <input type="text" id="postTitle" class="form-input" placeholder="请输入帖子标题">
                </div>
                <div class="form-group">
                    <label class="form-label">内容</label>
                    <textarea id="postContent" class="form-textarea" placeholder="请输入帖子内容（支持Markdown格式）"></textarea>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="createPost()">发布帖子</button>
                    <button class="btn btn-secondary" onclick="showPage('home')">取消</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 配置 ====================
        const CONFIG = {
            // GitHub OAuth 配置
            clientId: "0v231iBvlL0tXtyGp3pIN", // 你的 Client ID
            redirectUri: "https://asdfghjkl088.github.io", // 你的 GitHub Pages 地址
            scope: "write:discussion read:user user:email public_repo",
            
            // 仓库配置
            repoOwner: "ASDFGHJKL088",
            repoName: "BScc-po",
            
            // 开发者凭据
            devCredentials: {
                username: "root",
                password: "78563"
            }
        };

        // 应用状态
        let currentUser = null;
        let accessToken = null;
        let toastQueue = [];

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            // 检查 URL 中的 access_token
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            const token = params.get('access_token');
            const error = params.get('error');
            
            if (token) {
                // 清除 URL 中的 token
                window.history.replaceState({}, document.title, window.location.pathname);
                
                accessToken = token;
                getUserInfo();
            } else if (error) {
                showToast('error', '登录失败', `错误: ${error}`);
            }
            
            // 检查本地存储
            const savedUser = localStorage.getItem('bscc_forum_user');
            const savedToken = localStorage.getItem('bscc_forum_token');
            
            if (savedUser && savedToken) {
                try {
                    currentUser = JSON.parse(savedUser);
                    accessToken = savedToken;
                    showForum();
                } catch (e) {
                    console.error('加载用户数据失败:', e);
                    clearLocalStorage();
                }
            }
        });

        // ==================== GitHub OAuth 登录 ====================
        function githubLogin() {
            const authUrl = `https://github.com/login/oauth/authorize?client_id=${CONFIG.clientId}&redirect_uri=${encodeURIComponent(CONFIG.redirectUri)}&scope=${CONFIG.scope}&response_type=token`;
            window.location.href = authUrl;
        }

        // ==================== 获取用户信息 ====================
        async function getUserInfo() {
            try {
                const response = await fetch('https://api.github.com/user', {
                    headers: {
                        'Authorization': `token ${accessToken}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (!response.ok) throw new Error('获取用户信息失败');
                
                const userData = await response.json();
                
                // 获取邮箱
                const emailResponse = await fetch('https://api.github.com/user/emails', {
                    headers: {
                        'Authorization': `token ${accessToken}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                let email = '';
                if (emailResponse.ok) {
                    const emails = await emailResponse.json();
                    const primaryEmail = emails.find(e => e.primary) || emails[0];
                    if (primaryEmail) email = primaryEmail.email;
                }
                
                // 保存用户信息
                currentUser = {
                    id: userData.id,
                    username: userData.login,
                    name: userData.name || userData.login,
                    email: email,
                    avatar: userData.avatar_url,
                    profileUrl: userData.html_url
                };
                
                localStorage.setItem('bscc_forum_user', JSON.stringify(currentUser));
                localStorage.setItem('bscc_forum_token', accessToken);
                
                showToast('success', '登录成功', `欢迎 ${currentUser.username}！`);
                setTimeout(() => showForum(), 1500);
                
            } catch (error) {
                console.error('获取用户信息失败:', error);
                showToast('error', '登录失败', error.message);
            }
        }

        // ==================== 显示论坛界面 ====================
        function showForum() {
            // 更新用户界面
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('userName').textContent = currentUser.username;
            
            const avatarEl = document.getElementById('userAvatar');
            if (currentUser.avatar) {
                avatarEl.innerHTML = `<img src="${currentUser.avatar}" alt="${currentUser.username}">`;
            } else {
                avatarEl.textContent = currentUser.username.charAt(0).toUpperCase();
            }
            
            // 切换到首页
            document.getElementById('loginPage').classList.remove('active');
            document.getElementById('homePage').classList.add('active');
            
            // 加载帖子
            loadPosts();
        }

        // ==================== 页面切换 ====================
        function showPage(pageName) {
            // 隐藏所有页面
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            
            // 显示目标页面
            document.getElementById(`${pageName}Page`).classList.add('active');
            
            // 如果是首页，刷新帖子
            if (pageName === 'home') {
                loadPosts();
            }
        }

        // ==================== 加载帖子 ====================
        async function loadPosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted)">加载中...</div>';
            
            try {
                const response = await fetch(`https://api.github.com/repos/${CONFIG.repoOwner}/${CONFIG.repoName}/discussions`, {
                    headers: {
                        'Authorization': `token ${accessToken}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const discussions = await response.json();
                
                if (discussions.length === 0) {
                    container.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted)">
                            <div style="font-size: 48px; margin-bottom: 20px;">💬</div>
                            <h3 style="margin-bottom: 10px;">还没有讨论</h3>
                            <p>成为第一个发帖的人吧！</p>
                            <button class="btn btn-primary" onclick="showPage('new-post')" style="margin-top: 20px;">创建第一个讨论</button>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = discussions.map(discussion => `
                    <div class="post-card" onclick="window.open('${discussion.html_url}', '_blank')">
                        <div class="post-header">
                            <div class="avatar" style="width: 24px; height: 24px; font-size: 12px;">
                                ${discussion.user.avatar_url ? 
                                    `<img src="${discussion.user.avatar_url}" alt="${discussion.user.login}">` : 
                                    discussion.user.login.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <div class="post-author">${discussion.user.login}</div>
                                <div class="post-date">${formatDate(discussion.created_at)}</div>
                            </div>
                        </div>
                        <h3 class="post-title">${escapeHtml(discussion.title)}</h3>
                        <div class="post-preview">${escapeHtml(discussion.body.substring(0, 150))}${discussion.body.length > 150 ? '...' : ''}</div>
                        <div class="post-stats">
                            <span>💬 ${discussion.comments}</span>
                            <span>👍 ${discussion.reactions?.['+1'] || 0}</span>
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                console.error('加载帖子失败:', error);
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--error)">
                        <h3 style="margin-bottom: 10px;">加载失败</h3>
                        <p style="margin-bottom: 20px;">${error.message}</p>
                        <button class="btn btn-primary" onclick="loadPosts()">重试</button>
                    </div>
                `;
            }
        }

        // ==================== 创建帖子 ====================
        async function createPost() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            
            if (!title || !content) {
                showToast('error', '创建失败', '请填写标题和内容');
                return;
            }
            
            try {
                const response = await fetch(`https://api.github.com/repos/${CONFIG.repoOwner}/${CONFIG.repoName}/discussions`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${accessToken}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: title,
                        body: content,
                        category: 'General'
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || '创建失败');
                }
                
                const discussion = await response.json();
                
                showToast('success', '发布成功', '帖子已创建到 GitHub 讨论区');
                
                // 清空表单
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                
                // 返回首页
                setTimeout(() => {
                    showPage('home');
                    loadPosts();
                }, 1500);
                
            } catch (error) {
                console.error('创建帖子失败:', error);
                showToast('error', '创建失败', error.message);
            }
        }

        // ==================== 退出登录 ====================
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                showToast('info', '退出登录', '祝您愉快！');
                setTimeout(() => {
                    clearLocalStorage();
                    currentUser = null;
                    accessToken = null;
                    document.getElementById('userInfo').style.display = 'none';
                    document.getElementById('loginPage').classList.add('active');
                    document.getElementById('homePage').classList.remove('active');
                }, 1000);
            }
        }

        // ==================== 右侧弹窗系统 ====================
        function showToast(type, title, message) {
            const container = document.getElementById('toastContainer');
            const toastId = 'toast-' + Date.now();
            
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };
            
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.id = toastId;
            toast.innerHTML = `
                <div class="toast-icon">${icons[type]}</div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="removeToast('${toastId}')">×</button>
            `;
            
            container.appendChild(toast);
            
            // 5秒后自动移除
            setTimeout(() => {
                removeToast(toastId);
            }, 5000);
        }

        function removeToast(toastId) {
            const toast = document.getElementById(toastId);
            if (toast) {
                toast.style.animation = 'slideOutRight 0.3s ease-out';
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 300);
            }
        }

        // ==================== 开发者入口 ====================
        function showDevModal() {
            document.getElementById('devModal').classList.add('active');
            document.getElementById('devUsername').focus();
        }

        function closeDevModal() {
            document.getElementById('devModal').classList.remove('active');
            document.getElementById('devUsername').value = '';
            document.getElementById('devPassword').value = '';
        }

        function devKeyPress(event) {
            if (event.key === 'Enter') {
                devLogin();
            }
        }

        function devLogin() {
            const username = document.getElementById('devUsername').value;
            const password = document.getElementById('devPassword').value;
            
            if (username === CONFIG.devCredentials.username && password === CONFIG.devCredentials.password) {
                showToast('success', '开发者登录', '欢迎，管理员！');
                closeDevModal();
                
                // 显示调试信息
                console.log('=== 开发者信息 ===');
                console.log('用户:', currentUser);
                console.log('令牌:', accessToken ? '已设置' : '未设置');
                console.log('仓库:', `${CONFIG.repoOwner}/${CONFIG.repoName}`);
                console.log('===============');
                
            } else {
                showToast('error', '登录失败', '账户或密码错误');
            }
        }

        // ==================== 工具函数 ====================
        function clearLocalStorage() {
            localStorage.removeItem('bscc_forum_user');
            localStorage.removeItem('bscc_forum_token');
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            
            // 如果是今天
            if (diff < 24 * 60 * 60 * 1000) {
                if (diff < 60 * 60 * 1000) {
                    return `${Math.floor(diff / (60 * 1000))}分钟前`;
                }
                return `${Math.floor(diff / (60 * 60 * 1000))}小时前`;
            }
            
            // 如果是今年
            if (date.getFullYear() === now.getFullYear()) {
                return `${date.getMonth() + 1}月${date.getDate()}日`;
            }
            
            return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
